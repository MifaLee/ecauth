upstream main_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream datalens_backend {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream ecinsight_backend {
    server 127.0.0.1:3004;
    keepalive 32;
}

upstream chartai_backend {
    server 127.0.0.1:3005;
    keepalive 32;
}


server {
    listen 80;
    listen [::]:80;
    server_name tools.workec.com;

    # 乐享图片存储目录
    location /uploads/lexiang/ {
        alias /var/www/uploads/lexiang/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 微信公众号 API 代理
    location /api/wechat/ {
        proxy_pass https://api.weixin.qq.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.weixin.qq.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 乐享知识库 MCP 代理
    location /api/lexiang {
        proxy_pass https://mcp.lexiang-app.com/mcp;
        proxy_ssl_server_name on;
        proxy_set_header Host mcp.lexiang-app.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Main App API
    location /api/ {
        proxy_pass http://main_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        client_max_body_size 60m;
    }

    # Health
    location = /health {
        proxy_pass http://main_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # API Gateway Log Viewer (仅内网访问)
    location = /gatewaylogformifa {
        proxy_pass http://127.0.0.1:3303/gatewaylogformifa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /gateway/ {
        proxy_pass http://127.0.0.1:3303/gateway/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        client_max_body_size 50m;
    }

    # Uploads - 代理到 api-gateway
    location /uploads/ {
        proxy_pass http://127.0.0.1:3303/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # DataLens frontend
    location /datalens {
        alias /var/www/datalens/frontend/dist;
        index index.html;
        try_files $uri $uri/ /datalens/index.html;
    }

    location /datalens/assets/ {
        alias /var/www/datalens/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /datalens/api/ {
        rewrite ^/datalens/api/(.*) /api/$1 break;
        proxy_pass http://datalens_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # TelWord
    location = /telword {
        return 301 /telword/;
    }

    location /telword/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # AI Nexus
    location = /ainexus {
        return 301 /ainexus/;
    }

    location /ainexus/ {
        alias /home/ainexus/client/dist/;
        index index.html;
        try_files $uri $uri/ /ainexus/index.html;
    }

    location /ainexus/assets/ {
        alias /home/ainexus/client/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /ainexus/api/ {
        proxy_pass http://127.0.0.1:3001/ainexus/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    # ECInsight
    location = /ecinsight {
        return 301 /ecinsight/;
    }

    location /ecinsight/ {
        proxy_pass http://ecinsight_backend/ecinsight/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    # TelScript
    location = /telscript {
        return 301 /telscript/;
    }

    location /telscript/ {
        proxy_pass http://127.0.0.1:3003/telscript/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /telscript/api/ {
        proxy_pass http://127.0.0.1:3003/telscript/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    # ChartAI
    location = /chartai {
        return 301 /chartai/;
    }

    location /chartai/ {
        proxy_pass http://chartai_backend/chartai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    # Lexiang
    location = /lexiang {
        return 301 /lexiang/;
    }

    location /lexiang/ {
        proxy_pass http://127.0.0.1:3006/lexiang/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # TelOperation
    location = /teloperation {
        return 301 /teloperation/;
    }

    location /teloperation/ {
        proxy_pass http://127.0.0.1:3007/teloperation/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # Doocs MD - 通过 main-app 代理，支持权限检查
    location /doocs {
        proxy_pass http://main_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location = /xiaoshou2leknowledge {
        return 301 /xiaoshou2leknowledge/;
    }

    location /xiaoshou2leknowledge/ {
        alias /home/xiaoshou2lxknowledge/;
        index index.html;
        try_files $uri $uri/ /xiaoshou2leknowledge/index.html;
    }

    location /xiaoshou2leknowledge/assets/ {
        alias /home/xiaoshou2lxknowledge/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # EC OAuth2 Callback - proxy to eclogindemo app
    location = /api/ec-oauth/callback {
        proxy_pass http://127.0.0.1:3008/eclogindemo/auth/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # EC Login Demo (EC OAuth2 SSO Demo)
    location = /eclogindemo {
        return 301 /eclogindemo/;
    }

    location /eclogindemo/ {
        proxy_pass http://127.0.0.1:3008/eclogindemo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        proxy_pass http://main_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
